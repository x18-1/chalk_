services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chalk
      POSTGRES_PASSWORD: chalk
      POSTGRES_DB: chalk
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chalk"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chalk
      MINIO_ROOT_PASSWORD: chalk-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 chalk chalk-minio-secret;
      mc mb myminio/chalk-uploads --ignore-existing;
      mc mb myminio/chalk-backups --ignore-existing;
      mc anonymous set download myminio/chalk-uploads;
      exit 0;
      "

  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   ports: ["4318:4318"]
  #   volumes: [./otel-config.yaml:/etc/otel-config.yaml]
  #   command: ["--config=/etc/otel-config.yaml"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
