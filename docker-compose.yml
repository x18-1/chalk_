services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalk}
      POSTGRES_DB: ${POSTGRES_DB:-chalk}
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-chalk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-chalk-minio-secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-chalk}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-chalk-minio-secret}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-chalk-uploads}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-chalk-backups}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY_ID} $${S3_SECRET_ACCESS_KEY};
      mc mb myminio/$${S3_BUCKET_UPLOADS} --ignore-existing;
      mc mb myminio/$${S3_BUCKET_BACKUPS} --ignore-existing;
      mc anonymous set none myminio/$${S3_BUCKET_UPLOADS};
      exit 0;
      "

  # otel-collector:
  #   image: otel/opentelemetry-collector-contrib:latest
  #   ports: ["4318:4318"]
  #   volumes: [./otel-config.yaml:/etc/otel-config.yaml]
  #   command: ["--config=/etc/otel-config.yaml"]

volumes:
  postgres_data:
  minio_data:
