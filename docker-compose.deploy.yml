services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chalk}
      POSTGRES_DB: ${POSTGRES_DB:-chalk}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-chalk}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-chalk-minio-secret}
    ports:
      - "${MINIO_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:latest
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-chalk}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-chalk-minio-secret}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-chalk-uploads}
      S3_BUCKET_BACKUPS: ${S3_BUCKET_BACKUPS:-chalk-backups}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "mc alias set myminio http://minio:9000 $${S3_ACCESS_KEY_ID}
      $${S3_SECRET_ACCESS_KEY} && mc mb myminio/$${S3_BUCKET_UPLOADS}
      --ignore-existing && mc mb myminio/$${S3_BUCKET_BACKUPS} --ignore-existing
      && mc anonymous set none myminio/$${S3_BUCKET_UPLOADS}"

  rag-sidecar:
    build:
      context: ./apps/rag-sidecar
    env_file: .env
    environment:
      RAG_HOST: 0.0.0.0
      RAG_PORT: 8010
      RAG_WORKING_DIR: /app/data/rag
    volumes:
      - rag_data:/app/data/rag
    expose:
      - "8010"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-chalk}:${POSTGRES_PASSWORD:-chalk}@postgres:5432/${POSTGRES_DB:-chalk}
      S3_ENDPOINT: http://minio:9000
      S3_PRESIGN_ENDPOINT: ${S3_PRESIGN_ENDPOINT:-http://localhost:9000}
      RAG_SIDECAR_URL: http://rag-sidecar:8010
      SESSIONS_ROOT: /app/data/sessions
      WEB_ORIGIN: ${DEPLOY_WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "${API_HOST_PORT:-3001}:3001"
    volumes:
      - api_sessions:/app/data/sessions
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rag-sidecar:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3001}
    environment:
      WEB_PORT: 3000
    ports:
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
  rag_data:
  api_sessions:
